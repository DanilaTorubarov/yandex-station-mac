# Подключаем штатный конфиг ALSA и добавляем dmix-устройство,
# через которое shairport-sync сможет играть одновременно с aplay
# (голосовые ответы ассистента во время AirPlay).
</usr/share/alsa/alsa.conf>

pcm.dmix_spk {
  type dmix
  ipc_key 1024
  ipc_key_add_uid false
  ipc_perm 0666
  slave.pcm "hw:0,0"
  slave.channels 2
  slave.buffer_size 7680
  slave.period_size 960
}

pcm.dmix_spk_plug {
  type plug
  slave.pcm "dmix_spk"
}
