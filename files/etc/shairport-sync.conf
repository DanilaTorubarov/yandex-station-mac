general = {
  name = "Яндекс Станция Мини 2";
  port = 5000;

  # Не применять программное затухание в shairport-sync —
  # громкостью управляет аппаратный усилитель SPK Master через airplay-vol.sh
  ignore_volume_control = "yes";

  # освободить звуковую карту у maind --mediad
  run_this_before_entering_active_state = "/etc/airplay-free.sh";

  # синхронизировать громкость AirPlay с SPK Master и Master на колонке
  run_this_when_volume_is_set = "/data/mictap/airplay-vol.sh";

  # задержка ~0.5 c вместо штатных ~2 c
  audio_backend_latency_offset_in_seconds = -1.5;
  audio_backend_buffer_desired_length_in_seconds = 0.15;
};

alsa = {
  # dmix: колонка не захватывается монопольно, поэтому ответы ассистента
  # слышны поверх AirPlay
  output_device = "dmix_spk_plug";
  output_rate = 44100;
};
